name: CI

on:
  push:
    branches:
      - main
      - release/**

  pull_request:

jobs:
  lint:
    name: "Linting"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        name: Checkout code
      - name: Run linter
        run: |
          make lint

  test:
    name: "Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        name: Checkout code
      - name: Run tests
        run: |
          make test

  library:
    name: "Library-only build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        name: Checkout code
      - name: Run tests
        run: cargo build --no-default-features --lib --features cadence
